<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qahhorali</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="titles">
            <div class="title">ToDoList</div>
            <img class="title-logo" src="images/title-logo.jpg" alt="">
        </div>
        <div class="input-form">
            <input type="text" id="task-input" placeholder="Enter text">
            <div class="add-btn" id="add-item">
                <div class="btn-icon"><i class="fa-solid fa-plus"></i></div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        <ul class="ul" id="ul-items"></ul>
    </div>
    <div class="delate-modal" id="delate-modal">
        <div class="modal-title">O'chirish</div>
        <div class="task"></div>
        <div class="action">
            <buttton id="close-modal-item">Bekor qilish</buttton>
            <button id="delate-modal-item">O'chirish</button>
        </div>
    </div>
    <div class="edit-modal" id="edit-modal">
        <div class="modal-title">Taxrirlash</div>
        <input type="text" id="edit-input" class="edit-input">
        <div class="action">
            <button id="close-modal-edit">Bekor-qilish</button>
            <button id="save-modal-item">Saqlash</button>
        </div>
    </div>
    <div class="overlay"></div>
    <script src="script.js"></script>
</body>
</html>
